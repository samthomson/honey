services:
  honey:
    build: .
    ports:
      - "8080:8080"
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-localhost:8008}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - honey-data:/app/data
    restart: unless-stopped

  honey-dev:
    build: .
    profiles: ["dev"]
    ports:
      - "8080:8080"
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-host.docker.internal:8008}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - ./:/app
      - /app/node_modules
      - honey-dev-data:/app/data
    command: node --watch src/index.js
    restart: "no"

volumes:
  honey-data:
  honey-dev-data:
