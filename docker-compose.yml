services:
  honey:
    build: .
    ports:
      - "8080:8080"
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - ES_URL=http://elasticsearch:9200
    volumes:
      - honey-data:/app/data
    restart: unless-stopped
    depends_on:
      - elasticsearch
    networks:
      - honey-net

  honey-dev:
    build: .
    profiles: ["dev"]
    ports:
      - "8080:8080"
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - ES_URL=http://elasticsearch:9200
    volumes:
      - ./:/app
      - /app/node_modules
      - honey-dev-data:/app/data
    command: node --watch src/index.js
    restart: "no"
    depends_on:
      - elasticsearch
    networks:
      - honey-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.name=honey-es
      - bootstrap.memory_lock=false
      - xpack.ml.enabled=false
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - honey-net

networks:
  honey-net:
    driver: bridge

volumes:
  honey-data:
  honey-dev-data:
  es-data:
